[project]
name = "bapu"
version = "0.3.0"
description = "扒谱: turn a song recording into a singable vocal score with lyrics (MIDI / SynthV project)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    # GPU stack: CUDA 12.8 wheels on Windows / Linux (RTX 50-series); macOS uses PyPI's (Apple chips, MPS).
    "torch==2.11.0; sys_platform != 'darwin'",
    "torchaudio==2.11.0; sys_platform != 'darwin'",
    "torchvision==0.26.0; sys_platform != 'darwin'",
    # audio-separator needs torch >= 2.13 on Apple chips; torchaudio stops at 2.11.1, which accepts it.
    "torch==2.13.0; sys_platform == 'darwin'",
    "torchaudio==2.11.1; sys_platform == 'darwin'",
    "torchvision==0.28.0; sys_platform == 'darwin'",
    # Source separation (BS-RoFormer / Mel-Band RoFormer via audio-separator).
    # audio-separator 0.48's base install misses onnxruntime and audioread.
    "audio-separator==0.48.0",
    "onnxruntime>=1.31",
    "audioread>=3.1",
    # Audio I/O and analysis. torchaudio 2.11 needs torchcodec for load(); use soundfile.
    "librosa>=1.0",
    "soundfile>=0.14",
    "soxr>=1.1",
    "numpy>=2.5",
    "scipy>=1.18",
    # MIDI export, the CLI, YAML corrections (SOME inference is ported into bapu.backends.some).
    "mido>=1.3.3",
    "click>=8.5",
    "pyyaml>=6.0",
    # Lyrics -> phonemes for forced alignment.
    "tojyutping>=3.2",
    "opencc-python-reimplemented>=0.1.7",
    "qwen-asr>=0.0.6",
    "fastapi>=0.162",
    "uvicorn>=0.54",
    "python-multipart>=0.0.33",
    "pypinyin>=0.55",
    "av>=19",
    "nvidia-ml-py>=12",
    "psutil>=6",
    "sudachipy>=0.7.0",
    "sudachidict-core>=20261015",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bapu"]

[tool.uv]
# Windows, Linux x86-64 and macOS on Apple chips (PyTorch has no Intel-Mac builds since 2.3).
environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }
torchaudio = { index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }
torchvision = { index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }

[dependency-groups]
dev = [
    "cryptography>=44",
    "httpx>=0.28",
    "pytest>=9.2.0",
]

[project.scripts]
bapu = "bapu.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["regression: full-song regression tests; need BAPU_REGRESSION_AUDIO and the GPU models"]
